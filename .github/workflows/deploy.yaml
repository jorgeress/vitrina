name: Publicar Vitrina

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # La web es web/, en Astro, y lee las fichas de content/ sin tocarlas.
      # --ignore-scripts por lo mismo que con Quartz: sharp no tiene que
      # compilarse, y Pagefind trae su binario como dependencia opcional.
      - name: Instalar dependencias
        working-directory: web
        run: npm ci --ignore-scripts --include=optional

      # Los tipos de las paginas y, con ellos, el esquema de las fichas: una
      # nota de 11 o un estado mal escrito paran aqui, no en la web.
      - name: Revisar tipos
        working-directory: web
        run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      # Si los scripts se rompen, la vault se llena de fichas mal y eso no lo
      # nota el build: sale verde con las fichas equivocadas dentro. Las de la
      # web comprueban, entre otras cosas, que reparte los autores igual que
      # autores.py, que lo usa ella para las paginas de autor.
      - name: Probar los scripts y la web
        run: |
          pip install --quiet -r requirements.txt
          python3 scripts/pruebas.py
          npm --prefix web test

      # Lo que se publica igual pero se ha quedado atras: el bloque de cifras
      # del README, portadas que ya no usa nadie. No para el despliegue; sale
      # como aviso en el resumen del run.
      - name: Comprobar la vault
        run: python3 scripts/estado.py --comprobar

      # Construye las paginas, copia las portadas de la vault y hace el
      # indice del buscador.
      - name: Construir el sitio
        working-directory: web
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      # GitHub Pages no esta disponible en repos privados con el plan
      # gratuito, asi que el despliegue se salta mientras el repo lo sea.
      # En cuanto pase a publico se activa solo, sin tocar nada aqui.
      - uses: actions/configure-pages@v6
        if: ${{ !github.event.repository.private }}

      - uses: actions/upload-pages-artifact@v5
        if: ${{ !github.event.repository.private }}
        with:
          path: web/dist

  desplegar:
    needs: construir
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
