# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Vitrina
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: es-ES
  baseUrl: jorgeress.github.io/vitrina
  ignorePatterns:
    - private
    - templates
    - _plantillas
    - .obsidian
    - .trash
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      # Cinzel para los titulares: es una capital romana, la letra con la que se
      # rotula una sala de museo, y es lo que hace que "VITRINA" parezca el
      # nombre de una coleccion y no el de un blog. El cuerpo se queda en una
      # gruesa normal, que es lo que hay que leer.
      header: Cinzel
      body: Source Sans Pro
      code: IBM Plex Mono
    # Una vitrina a oscuras con las piezas iluminadas: fondo casi negro con un
    # punto calido, texto hueso y enlaces en un gris azulado frio. El dorado no
    # esta aqui a proposito, sino en custom.scss como `--dorado`, porque es de
    # una sola pagina, Lo mejor de lo mejor: si lo llevara el color de los
    # enlaces dejaria de distinguirse de todos los demas.
    colors:
      lightMode:
        light: "#f7f4ef"
        lightgray: "#e3ded4"
        gray: "#948d80"
        darkgray: "#4b463f"
        dark: "#201d1a"
        secondary: "#4c5c6b"
        tertiary: "#6f7f8e"
        highlight: rgba(76, 92, 107, 0.08)
        textHighlight: "#a07b1244"
      darkMode:
        light: "#0f0e10"
        lightgray: "#2a272a"
        gray: "#6f6a72"
        darkgray: "#d5cfc4"
        dark: "#ece7dd"
        secondary: "#9aa7b4"
        tertiary: "#7f8c99"
        highlight: rgba(154, 167, 180, 0.1)
        textHighlight: "#c9a22755"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      # Las fichas sin texto tambien entran en el buscador: una ficha vacia
      # sigue teniendo titulo, y quien busca "Elden Ring" espera encontrarla.
      # El precio eran las cinco paginas sueltas de los .base, que entraban con
      # el titulo del fichero y sin texto. Del arbol lateral se van con el
      # filterFn del explorer, y del buscador las saca ahora el transformador
      # de ./plugins/vitrina, que las marca `unlisted`: es lo unico que este
      # plugin mira. Meter *.base en ignorePatterns deja sin galeria a las
      # cinco secciones (comprobado).
      includeEmptyFiles: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  # Sin dominio propio: un fichero CNAME rompe las Pages de proyecto.
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      # El plugin de bases emite una pagina suelta por cada fichero .base, que
      # repite la galeria que ya esta en el indice de su seccion. Se van del
      # arbol aqui. El componente hace opts.filterFn?.toString(), asi que una
      # cadena de YAML le vale igual que una funcion, y el cliente la reconstruye
      # con new Function. Hay que repetir el filtro de "tags", que es el que
      # trae por defecto y este sustituye.
      filterFn: '(node) => node.slugSegment !== "tags" && !node.slugSegment.endsWith(".base")'
      # El arbol en el orden del sitio y no en el del abecedario. Por defecto
      # ordena por nombre, y asi "autores", que no es una seccion sino lo que
      # las cruza, abria la lista por delante de Juegos. La lista de aqui es el
      # orden de la portada: las cuatro secciones, autores, y al final las dos
      # paginas sueltas, con Lo mejor de lo mejor por delante de Creditos, que
      # por nombre caian justo al reves.
      #
      # Es la misma via que filterFn: el componente serializa la funcion y el
      # cliente la rehace con new Function, asi que una cadena de YAML vale.
      # Dentro de las carpetas no se toca nada: alli sigue mandando el titulo.
      sortFn: |
        (a, b) => {
          const orden = ["juegos", "pelis", "libros", "musica", "autores", "favoritos", "creditos"]
          const ia = orden.indexOf(a.slugSegment)
          const ib = orden.indexOf(b.slugSegment)
          if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib)
          if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1
          return (a.displayName || "").localeCompare(b.displayName || "", undefined, {
            numeric: true,
            sensitivity: "base",
          })
        }
    layout:
      position: left
      priority: 50
  # Envuelto en ./plugins/grafo, que le arregla a que pagina cree que ha
  # llegado. El paquete sigue siendo este y el porque esta alli.
  - source: "@quartz-community/graph"
    enabled: false
  - source: "./plugins/grafo"
    enabled: true
    options:
      # Las etiquetas, como nodos. El tronco lo pone el campo `seccion` de cada
      # ficha: cuelga de su seccion y las secciones de Vitrina, asi que el grafo
      # sale de una pieza. Pero eso es un arbol, y un arbol no junta una peli
      # con un juego: entre ramas no hay ni un enlace, porque una ficha no cita
      # a ninguna otra. Los generos si cruzan la coleccion entera, porque el tag
      # de un juego y el de una peli caen en el mismo sitio, asi que los atajos
      # del dibujo salen de ahi y de las paginas de autor.
      localGraph:
        showTags: true
      globalGraph:
        showTags: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # Fuera: pintaba la fecha del commit y el tiempo de lectura sobre cada ficha.
  # En un catalogo las dos mienten. "05 sept 2026" es cuando toque el fichero,
  # no cuando se estreno la peli, y encima del titulo se lee como el año de la
  # obra; y "Se lee en 1 min" mide un parrafo de tres lineas. El hueco lo ocupa
  # ahora la cabecera de Vitrina, que dice el año de verdad.
  - source: "@quartz-community/content-meta"
    enabled: false
  # La caratula y los datos de la obra, encima del texto de la ficha.
  - source: "./plugins/vitrina"
    enabled: true
    order: 60
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      # El plugin trae "Home" y no lo traduce con el locale.
      rootName: Inicio
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jorgeress/vitrina
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options:
      defaultViewType: cards
      linkResolution: shortest
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: true
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    # Una galeria y una etiqueta se quedan sin el indice ni los retroenlaces: el
    # primero lista lo que ya esta debajo y los segundos repiten entera la lista
    # de la pagina, ficha por ficha y debajo de la galeria que ya las enseña.
    #
    # El grafo si se queda, y es lo unico que hay en esa barra: en una etiqueta
    # dibuja de golpe todo lo que la lleva, cruzando secciones, que es lo que no
    # cuenta la lista; y en una seccion, su rama entera colgando de Vitrina.
    # Esto ultimo solo dibuja algo desde que el grafo va envuelto en
    # ./plugins/grafo: antes no encontraba el nodo de la seccion y se inventaba
    # uno vacio, asi que la barra enseñaba un punto suelto sin una sola arista.
    #
    # Los nombres llevan el paquete delante porque el filtro compara con la
    # fuente entera, tal cual esta escrita arriba: "backlinks" a secas no quita
    # nada, y asi es como estas dos listas llevaban desde el principio, sin
    # quitar nada de nada.
    folder:
      exclude:
        - "@quartz-community/reader-mode"
        - "@quartz-community/table-of-contents"
        - "@quartz-community/backlinks"
    tag:
      exclude:
        - "@quartz-community/reader-mode"
        - "@quartz-community/table-of-contents"
        - "@quartz-community/backlinks"
    canvas: {}
    bases: {}
